<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelShelf Membership</title>
      <style>
        header{
            background-color: rgb(134, 140, 251);
             font-style: italic;
            font-family:'Times New Roman', Times, serif;
            color:rgb(246, 246, 10);
        }
        
        nav{
            color:rgb(255, 247, 0);
            text-align: center;
            font-size: 20px;
        }

        nav a {
        color: rgb(252, 248, 6);
        text-decoration: none;
        font-family:'Times New Roman', Times, serif;

        }
        body{
            background-color:rgb(248, 199, 246);
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        h1{
            color:rgb(240, 252, 7);
            font-family:sans-serif;
            text-align: center;
        }

        h2{
            font-size:30px;
            line-height:normal;
        }

        p{
            text-align: center;
            font-size: 30px;
        }

        section{
            font-size:17px;   
        }
        footer{
            align:left;
        }
      
    </style>
</head>
<body>
    <header>
         <h1><em>PixelShelf Bookstore</em></h1>

            <nav>
                <a href="./index.html"> Home </a>
                |
                <a href="./catlog.html">Catlogs</a>
                |
                <a href="./gallery.html">Gallery</a>
                 |
                <a href="./membership.html">Membership</a>
            </nav>
        </header>

         <main>

        <section>

            <h2>Membership / Order Form</h2>

            <p>
                Join PixelShelf Bookstore and stay connected
                with your favourite books!
            </p>


            <!-- SIGNUP FORM -->

            <form action="./submit.html">

                <!-- NAME -->

                <div class="form-group">

                    <label for="name">Full Name:</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">Email Address:</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <!-- PHONE NUMBER -->

                <div class="form-group">

                    <label for="phone">Phone Number:</label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number">

                </div>


                <!-- FAVORITE GENRE -->

                <div class="form-group">

                    <label for="genre">Favorite Book Genre:</label>

                    <select id="genre" name="genre">

                        <option value="">Select a genre</option>

                        <option value="fiction">Fiction</option>

                        <option value="scifi">Science Fiction</option>

                    </select>

                </div>


                <!-- MEMBERSHIP TYPE -->

                <div class="form-group">

                    <p><strong>Membership Type:</strong></p>

                    <input
                        type="radio"
                        id="new"
                        name="membership"
                        value="new"
                        required>

                    <label for="new">New Member</label>


                    <input
                        type="radio"
                        id="renew"
                        name="membership"
                        value="renew">

                    <label for="renew">Renewing Member</label>

                </div>


                <!-- SUBSCRIPTION CHECKBOX -->

                <div class="form-group">

                    <input
                        type="checkbox"
                        id="alerts"
                        name="alerts"
                        value="yes">

                    <label for="alerts">
                        Subscribe to new-release alerts
                    </label>

                </div>


                <!-- BOOK REQUEST / COMMENT -->

                <div class="form-group">

                    <label for="comment">
                        Book Request / Comment:
                    </label>

                    <textarea
                        id="comment"
                        name="comment"
                        rows="5"
                        placeholder="Tell us about a book you are looking for...">
                    </textarea>

                </div>


                <!-- SUBMIT BUTTON -->

                <button type="submit">
                    Submit Form
                </button>

            </form>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>
        <p>&copy; 2026 PixelShelf Bookstore. All rights reserved.</p>
    </footer>
</body>
</html>
